  <head>
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1 || (e.filename && e.filename.indexOf('vite') !== -1))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var msg = String(e.reason && e.reason.message || e.reason || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
